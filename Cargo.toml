[workspace]
resolver = "3"
members = ["crates/engine", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
engine = { path = "crates/engine" }

[profile.dev]
# Keep our own code fast to compile, but optimize dependencies so
# rendering and audio are usable in debug builds.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
