[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core runtime: rendering, audio, scenes, zones, behaviors."

[dependencies]
audionimbus = { version = "0.16.2", features = ["auto-install"] }
bevy_reflect = { version = "0.20.1", features = ["glam"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
glam = { version = "0.33", features = ["bytemuck", "serde"] }
gltf = "1.4.1"
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
log = "0.4.35"
pollster = "1.0.1"
rapier3d = "0.36.1"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
transform-gizmo = "0.11.0"
wgpu = "30.0.1"
winit = "0.30.13"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
